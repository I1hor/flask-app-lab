{% extends 'base.html' %}

{% block title %}Greetings Page{% endblock %}

{% block content %}

<nav>
    <ul>
        <li>
            <a href="{{ url_for('user.greetings', name='John', age=30)}}">Greet John</a>
        </li>
        <li>
            <a href="{{ url_for('user.admin')}}">Admin</a>
        </li>
    </ul>
</nav>

<h2>Hello, {{ name }}</h2>
{% if age %}
    <p>You are {{ age }} years old.</p>
{% else %}
    <p>Age is uknown.</p>
{% endif %}
{% endblock %}
